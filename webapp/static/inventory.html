<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대리점 재고 - RS-Treasure</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="css/style.css?v=20260828c" />
</head>
<body class="admin-page inventory-assist">

<header class="topbar">
  <span class="brand">대리점 재고</span>
  <nav id="chatNav" class="hidden">
    <span id="asOfBadge" class="as-of-badge muted small hidden"></span>
    <label id="sktDealerWrap" class="skt-dealer-wrap hidden">
      대리점
      <select id="sktDealerSelect" aria-label="대리점 선택">
        <option value="">전체 대리점</option>
      </select>
    </label>
    <a class="muted small" id="chatAdminLink" href="admin">관리자</a>
    <span id="chatUser" class="muted small"></span>
    <button id="chatLogoutBtn">로그아웃</button>
  </nav>
</header>

<main>
  <section id="screen-chat-login" class="screen">
    <div class="card center-card">
      <h1>대리점 재고</h1>
      <p class="muted">아이디와 비밀번호로 로그인하세요. 로그인한 계정의 재고만 보입니다.</p>
      <input id="chatUsername" type="text" placeholder="아이디" autocomplete="username" />
      <input id="chatPassword" type="password" placeholder="비밀번호" autocomplete="current-password" />
      <button type="button" id="chatLoginBtn" class="btn-primary">시작하기</button>
      <p id="chatLoginError" class="error hidden"></p>
    </div>
  </section>

  <div id="chat-app" class="hidden">
    <aside id="hqPanel" class="hq-panel hidden" aria-label="전체 대리점">
      <div class="hq-head">
        <h2>전체 대리점</h2>
        <p id="hqStatus" class="muted small">등록 0 · 업로드 0</p>
      </div>
      <button type="button" class="hq-all-btn active" data-dealer="" id="hqAllBtn">
        <span>합산 보기</span>
        <strong id="hqAllMeta">0대 · 0곳</strong>
      </button>
      <input id="hqSearch" type="search" placeholder="대리점 이름·코드 검색" autocomplete="off" />
      <div class="hq-toolbar">
        <div class="hq-filters" role="group" aria-label="업로드 상태">
          <button type="button" class="active" data-hq-filter="all">전체</button>
          <button type="button" data-hq-filter="uploaded">올림</button>
          <button type="button" data-hq-filter="pending">미업로드</button>
        </div>
        <label class="hq-sort-label">
          정렬
          <select id="hqSort">
            <option value="qty">대수 많은 순</option>
            <option value="aged">묵은 재고 순</option>
            <option value="recent">최근 업로드</option>
            <option value="name">이름 순</option>
          </select>
        </label>
      </div>
      <div id="hqDealerList" class="hq-dealer-list" role="list"></div>
    </aside>
    <div class="inventory-shell">
      <div class="inventory-map-pane">
        <div class="inventory-map-tools">
          <label class="inventory-upload">
            재고 엑셀
            <input id="inventoryFile" type="file" accept=".xlsx,.csv" />
          </label>
          <button type="button" id="inventoryUploadBtn">올리기</button>
          <button type="button" id="myLocationBtn">내 위치</button>
          <button type="button" id="areaSelectBtn">영역 선택</button>
          <button type="button" id="areaClearBtn" class="hidden">선택 해제</button>
          <div class="inventory-model-filter">
            대표상품명
            <div class="multi-pick">
              <button type="button" class="multi-pick-btn" id="productShortBtn">전체</button>
              <div class="multi-pick-menu hidden" id="productShortMenu"></div>
            </div>
          </div>
          <div class="inventory-model-filter">
            모델명
            <div class="multi-pick">
              <button type="button" class="multi-pick-btn" id="modelNameBtn" disabled>대표상품 먼저</button>
              <div class="multi-pick-menu hidden" id="modelNameMenu"></div>
            </div>
          </div>
          <span id="inventoryUploadStatus" class="inventory-upload-status muted small"></span>
        </div>
        <div id="chatMap" class="treasure-map" aria-label="재고 지도"></div>
        <div id="areaTableWrap" class="inventory-area-table-wrap hidden">
          <div class="inventory-area-table-head">선택한 영역 재고</div>
          <div class="inventory-area-table-scroll">
            <table id="areaTable">
              <thead>
                <tr>
                  <th>기종</th>
                  <th>대수</th>
                  <th>매장</th>
                  <th>30일+</th>
                </tr>
              </thead>
              <tbody></tbody>
              <tfoot></tfoot>
            </table>
          </div>
        </div>
      </div>
      <aside class="inventory-chat">
        <div id="chatLog" class="chat-log"></div>
        <div class="chat-suggestions">
          <button type="button" data-q="오래 묵은 재고 어디가 많아?">오래된 재고</button>
          <button type="button" data-q="오래된 재고를 빨간색으로 보여줘">오래된 재고 빨간색</button>
          <button type="button" data-q="대리점별 재고 비교해줘" data-all-dealers>대리점 비교</button>
          <button type="button" data-q="현재 서울에 있는 재고 숫자가 몇 대인지?">서울 재고</button>
          <button type="button" data-q="김포에 뭐가 있어?">김포</button>
          <button type="button" data-q="이 영역에 기종별 재고 몇 대야">이 영역</button>
          <button type="button" data-q="내 위치 근처 재고 보여줘">가까운 곳</button>
        </div>
        <form id="chatForm" class="chat-composer">
          <button type="button" class="mic-btn" id="chatMicBtn" title="다음 단계: 음성 입력" disabled>🎤</button>
          <input id="chatInput" type="text" placeholder="재고 위치를 물어보세요" autocomplete="off" />
          <button type="submit" class="btn-primary">보내기</button>
        </form>
      </aside>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/inventory-chat.js?v=20260828c"></script>
</body>
</html>
